onboarding = false
[ui]
show_agent_labels_on_pane_borders = true
sidebar_collapsed_mode = "hidden"
pane_gaps = false

[ui.toast]
delivery = "system"

[theme]
name = "vesper"
auto_switch = false

[keys]
prefix = "ctrl+a"
split_vertical = "prefix+|"
zoom = "prefix+m"
navigate_workspace_up = "k"
navigate_workspace_down = "j"

[[keys.command]]
key = "prefix+ctrl+p"
type = "popup"
command = "python"
width = "80%"
height = "80%"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# Override herdr's built-in "new worktree" key (prefix+shift+g) with worktrunk's
# default-branch switch/create picker:
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

# Optional: bind current-branch creation separately.
[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch / create from current branch"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[experimental]
pane_history = true

[advanced]
scrollback_limit_bytes = 100000000
